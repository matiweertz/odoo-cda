steps:
  # 1. Intentar descargar la imagen previa para usar sus capas como caché
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/cda-odoo:latest || true

  # 2. Construir la imagen Docker usando la caché de la imagen previa
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/cda-odoo:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/cda-odoo:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/cda-odoo:latest'
      - '.'

  # 3. Subir las imágenes etiquetadas a Artifact Registry (desde Cloud Build)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/cda-odoo'
      - '--all-tags'

  # 4. Desplegar la imagen en la instancia VM odoo-srv vía SSH
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh odoo-srv --zone=${_ZONE} --tunnel-through-iap --command="
          sudo mkdir -p /var/lib/odoo &&
          sudo chmod 777 /var/lib/odoo &&
          gcloud auth configure-docker ${_REGION}-docker.pkg.dev --quiet &&
          docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/cda-odoo:$COMMIT_SHA &&
          docker stop odoo-container || true &&
          docker rm odoo-container || true &&
          docker run -d \
            --name odoo-container \
            --restart always \
            -v /var/lib/odoo:/var/lib/odoo \
            -p 8069:8069 \
            -p 8071:8071 \
            -p 8072:8072 \
            ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/cda-odoo:$COMMIT_SHA
        "

  # --------------------------------------------------------------------------
  # 5. Actualizar el módulo en la base
  #
  # Sin este paso el contenedor arranca con código nuevo contra un esquema
  # viejo: los campos que todavía no existen como columnas rompen las vistas.
  # Se corre el -u en un proceso aparte dentro del mismo contenedor y después
  # se reinicia, para que el servidor quede alineado con la base.
  # --------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh odoo-srv --zone=${_ZONE} --tunnel-through-iap --command="
          for i in \$(seq 1 30); do
            sudo docker exec odoo-container true >/dev/null 2>&1 && break
            sleep 2
          done
          sudo docker exec -u odoo odoo-container \
            odoo -c /etc/odoo/odoo.conf -d ${_DB_NAME} \
            -u cda_claims,cda_api --stop-after-init --no-http --workers=0
          RC=\$?
          sudo docker restart odoo-container
          exit \$RC
        "

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: 'southamerica-west1'
  _ZONE: 'southamerica-west1-b'
  _REPO_NAME: 'cda-odoo'
  # Base de datos de producción (confirmado con /web/database/list).
  _DB_NAME: 'cda'